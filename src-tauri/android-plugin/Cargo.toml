[package]
name = "animehub-android"
version = "0.3.0"
description = "Android-side bridges for AnimeHub: Keystore-backed encryption and Picture-in-Picture."
edition = "2021"
rust-version = "1.77"
license = "MIT"

[lib]
name = "animehub_android"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2.11", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
