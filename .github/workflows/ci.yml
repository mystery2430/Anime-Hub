# Builds and tests every push / PR. No secrets are needed here, so this runs
# on forks too.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Keep the Rust toolchain in one place for all jobs.
  RUST_BACKTRACE: 1

jobs:
  # ------------------------------------------------------------------ tests
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Rust format
        run: cargo fmt --all -- --check
        working-directory: src-tauri

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Rust tests
        run: cargo test --all
        working-directory: src-tauri

  # ------------------------------------------------- secret / hygiene audit
  audit:
    name: Dependency and secret audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo-audit (Rust advisories)
        run: |
          cargo install cargo-audit --locked
          cargo audit --file src-tauri/Cargo.lock
        continue-on-error: true # advisories should warn, not block a hotfix

      - name: No committed secrets
        run: |
          # Fail if any credential-looking literal is tracked.
          if git grep -nIE \
            -e 'BEGIN (RSA |EC )?PRIVATE KEY' \
            -e 'aws_secret_access_key' \
            -e 'AKIA[0-9A-Z]{16}' \
            -- . ':(exclude)tests/*'; then
            echo "::error::possible secret committed"
            exit 1
          fi

      - name: Keystore / key files are not tracked
        run: |
          if git ls-files | grep -Ei '\.(keystore|jks|p12|pfx|pem)$'; then
            echo "::error::signing material must never be committed"
            exit 1
          fi
          echo "ok"
