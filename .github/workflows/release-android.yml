# Produces signed Android APKs, published as release assets.
#
# Nothing secret lives in this file or in the repo: the keystore arrives as a
# base64 repository secret and is written to a temporary file that is deleted
# at the end of the job. If `ANDROID_KEYSTORE_BASE64` is not set the APK is
# built unsigned and clearly labelled as such.
name: Release Android

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      sign:
        description: "Sign the APK (requires the keystore secrets)"
        type: boolean
        default: true

permissions:
  contents: write # needed to attach assets to the release

env:
  CARGO_TERM_COLOR: always

jobs:
  android:
    name: Android APK (${{ matrix.abi }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        abi: [aarch64, armv7, x86_64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager --install "ndk;27.0.12077973" "platform-tools" "build-tools;34.0.0"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            ${{ matrix.abi == 'aarch64' && 'aarch64-linux-android'
             || matrix.abi == 'armv7' && 'armv7-linux-androideabi'
             || 'x86_64-linux-android' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Rust tests
        run: cargo test --all
        working-directory: src-tauri

      # --- signing material, held only for the lifetime of this job ---
      - name: Materialise keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_B64" | base64 -d > /tmp/animehub.keystore
          # Gradle reads these; they are never written into the repo.
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=/tmp/animehub.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
          echo "keystore ready"

      - name: Initialise the Android project
        run: npm run tauri android init

      - name: Build APK
        env:
          TAURI_ANDROID_SIGN: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: npm run tauri android build -- --apk --target ${{ matrix.abi }}

      - name: Shred the keystore
        if: always()
        run: |
          shred -u /tmp/animehub.keystore 2>/dev/null || rm -f /tmp/animehub.keystore
          rm -f src-tauri/gen/android/keystore.properties

      - uses: actions/upload-artifact@v4
        with:
          name: animehub-android-${{ matrix.abi }}
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  publish:
    name: Publish release
    needs: android
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: animehub-android-*
          merge-multiple: true
          path: apks

      - uses: softprops/action-gh-release@v2
        with:
          files: apks/**/*.apk
          generate_release_notes: true
