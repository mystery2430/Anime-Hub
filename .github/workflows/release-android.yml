# Builds signed production APKs for manual publication after all checks pass.
#
# Nothing secret lives in this file or in the repo. The keystore arrives as
# base64 environment secrets (environment `keystore`) and is written to a
# temporary file that is deleted at the end of the job. If the secret is
# absent the production build fails closed.
#
# `secrets` cannot be referenced from `if:` — GitHub rejects that — so a
# step exports `enabled=true/false` and later steps branch on that output.
name: Release Android

on:
  workflow_dispatch:
    inputs:
      sign:
        description: "Sign the APK (requires the keystore secrets)"
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  android:
    name: Android APK (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    # The four keystore secrets live on the `keystore` environment (not at
    # repository level); without this key `${{ secrets.* }}` resolves empty
    # and the job silently builds unsigned APKs.
    environment: keystore
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: aarch64
            target: aarch64-linux-android
          - abi: armv7
            target: armv7-linux-androideabi
          - abi: x86_64
            target: x86_64-linux-android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # v3 asks for the removed `tools` package and fails the job. v4 does not.
      - uses: android-actions/setup-android@v4

      # Same SDK/NDK pair as CI. Tauri CLI 2.11's template compiles against
      # API 36 and expects NDK 29.0.13846066 when it looks the toolchain up.
      - name: Install SDK 36 and the Tauri NDK
        run: |
          set -euo pipefail
          # `yes` exits 141 when sdkmanager closes the pipe; that is not a
          # license failure. The install itself must succeed.
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "platform-tools" \
            "ndk;29.0.13846066"
          NDK_PATH="${ANDROID_HOME}/ndk/29.0.13846066"
          test -x "${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          echo "NDK_HOME=${NDK_PATH}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${NDK_PATH}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Frontend tests
        run: npm test

      # gen/android does not exist until this step. The keystore file and the
      # Kotlin bridge both have to be written afterwards.
      - name: Initialise the Android project
        run: npm run tauri android init

      - name: Install the Kotlin bridge and PiP manifest
        run: python3 scripts/android_prepare.py

      - name: Detect keystore secret
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGN_INPUT: ${{ github.event.inputs.sign }}
        run: |
          set -euo pipefail
          # Tag pushes have no workflow input; treat that as "sign if we can".
          # An explicit workflow_dispatch sign=false always builds unsigned.
          if [ "${SIGN_INPUT:-true}" = "false" ] || [ -z "${KEYSTORE_B64}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "signing disabled (no secret, or sign=false)"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "signing enabled"
          fi

      - name: Require production signing
        if: steps.signing.outputs.enabled != 'true'
        run: |
          echo "::error::Production APKs require the release keystore and sign=true"
          exit 1

      - name: Materialise keystore
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          test -d src-tauri/gen/android
          echo "$KEYSTORE_B64" | base64 -d > /tmp/animehub.keystore
          # Quoted printf, not an unquoted heredoc: a secret that contains
          # `$(...)` or backticks must not be expanded by the shell.
          # Gradle reads this path. It is created only after android init,
          # and it is deleted in the shred step below.
          {
            printf 'storeFile=%s\n' /tmp/animehub.keystore
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > src-tauri/gen/android/keystore.properties
          echo "keystore ready"

      - name: Build APK
        env:
          CARGO_BUILD_JOBS: "1"
          CARGO_PROFILE_RELEASE_LTO: "off"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        # tee the log: runner log blobs are not always downloadable, but
        # ci_annotate.js re-emits the interesting lines as check annotations.
        run: |
          set -o pipefail
          npm run tauri android build -- --apk --target ${{ matrix.abi }} \
            2>&1 | tee /tmp/android-build.log

      - name: Annotate build failure
        if: failure()
        run: node scripts/ci_annotate.js /tmp/android-build.log "android build" || true

      # Gradle writes the per-target output under a generic name (e.g.
      # `app-universal-release.apk`), which loses the ABI and collides when
      # merged at publish time. Stage it under an ABI-qualified name instead;
      # the unsigned/signed suffix of the original is preserved.
      - name: Collect APK under an ABI-qualified name
        run: |
          set -euo pipefail
          mkdir -p dist-apk
          # Prefer the signed APK: once a signingConfig is active Gradle
          # names it without `-unsigned`; fall back to unsigned dev builds.
          f=$(find src-tauri/gen/android/app/build/outputs/apk \
                -path "*/release/*.apk" ! -name "*unsigned*" | head -1)
          test -n "$f"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose "$f"
          cp "$f" "dist-apk/animehub-${{ matrix.abi }}-release.apk"
          ls -la dist-apk

      - name: Shred the keystore
        if: always()
        run: |
          if [ -f /tmp/animehub.keystore ]; then
            shred -u /tmp/animehub.keystore || rm -f /tmp/animehub.keystore
          fi
          rm -f src-tauri/gen/android/keystore.properties

      - uses: actions/upload-artifact@v7
        with:
          name: animehub-android-${{ matrix.abi }}
          path: dist-apk/*.apk
          if-no-files-found: error
